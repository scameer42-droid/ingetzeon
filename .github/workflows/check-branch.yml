name: Cek cabang desain

on:
  push:
    branches: [gaya-apk]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Siapkan
        run: |
          flutter create --platforms=android --org com.zeon --project-name ingetzeon . > /dev/null 2>&1 || true
          python3 tool/patch_android.py > /dev/null 2>&1 || true
          mkdir -p ~/.android && cp tool/debug.keystore ~/.android/debug.keystore
          flutter pub get > pub.log 2>&1
      - name: Analisis, tes, build
        run: |
          set +e
          echo "=== analyze ===" > ci.log
          flutter analyze --no-fatal-infos --no-fatal-warnings > an.log 2>&1; echo "analyze rc=$?" >> ci.log
          grep -E "error •|warning •" an.log | head -80 >> ci.log
          echo "=== test ===" >> ci.log
          flutter test > test.log 2>&1; echo "test rc=$?" >> ci.log
          tail -30 test.log >> ci.log
          grep -v "^#[0-9]" test.log | grep -B3 -A22 "EXCEPTION CAUGHT BY\|Expected:\|overflowed" | grep -v "WIDGET INSPECTOR" | head -200 >> ci.log
          echo "=== build ===" >> ci.log
          flutter build apk --release > build.log 2>&1; echo "build rc=$?" >> ci.log
          tail -25 build.log >> ci.log
          cp build/app/outputs/flutter-apk/app-release.apk IngetZeon.apk 2>/dev/null || true
      - name: Simpan hasil
        if: always()
        run: |
          mkdir -p /tmp/s && cd /tmp/s && git init -q && git checkout -q -b ci-check
          cp "$GITHUB_WORKSPACE/ci.log" . 2>/dev/null || echo none > ci.log
          echo "${{ github.sha }}" > sha.txt
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "check" 
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-check
