name: Build IngetZeon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan folder Android
        run: |
          set -o pipefail
          flutter --version 2>&1 | tee ci.log
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.zeon --project-name ingetzeon . 2>&1 | tail -5 | tee -a ci.log
          fi
          python3 tool/patch_android.py 2>&1 | tee -a ci.log
          mkdir -p ~/.android && cp tool/debug.keystore ~/.android/debug.keystore

      - name: Ambil paket
        run: |
          set -o pipefail
          echo "=== pub get ===" >> ci.log
          flutter pub get 2>&1 | tee -a ci.log

      - name: Cek kode
        run: |
          set -o pipefail
          echo "=== analyze ===" >> ci.log
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a ci.log

      - name: Tes
        run: |
          echo "=== test ===" >> ci.log
          set +e
          flutter test > test.log 2>&1
          rc=$?
          tail -40 test.log | tee -a ci.log
          if [ $rc -ne 0 ]; then
            echo "===== RINCIAN GAGAL ====="
            grep -v "^#[0-9]" test.log | grep -B3 -A22 "EXCEPTION CAUGHT BY\|Expected:\|overflowed" | grep -v "WIDGET INSPECTOR" | head -400
          fi
          exit $rc

      - name: Build APK
        run: |
          set -o pipefail
          echo "=== build apk ===" >> ci.log
          flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} 2>&1 | tail -60 | tee -a ci.log
          cp build/app/outputs/flutter-apk/app-release.apk IngetZeon.apk

      - name: Build App Bundle (Google Play)
        run: |
          set -o pipefail
          echo "=== build appbundle ===" >> ci.log
          flutter build appbundle --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} 2>&1 | tail -30 | tee -a ci.log
          cp build/app/outputs/bundle/release/app-release.aab IngetZeon-bundle.aab
          grep -hE "targetSdk|compileSdk|minSdk" android/app/build.gradle* | tee -a ci.log

      - uses: actions/upload-artifact@v4
        with:
          name: IngetZeon-apk
          path: IngetZeon.apk

      - name: Siapkan website
        run: cd website && zip -qr ../IngetZeon-website.zip .

      - name: Terbitkan ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: IngetZeon v1.0.${{ github.run_number }}
          body: |
            - **IngetZeon.apk** — pasang di HP Android
            - **IngetZeon-website.zip** — versi website (unggah ke Cloudflare Pages)
            - **IngetZeon-bundle.aab** — bahan untuk Google Play (perlu ditandatangani ulang dengan kunci upload sebelum diunggah)
          files: |
            IngetZeon.apk
            IngetZeon-website.zip
            IngetZeon-bundle.aab
          make_latest: true

      # Ringkasan hasil build disimpan di branch "ci-status" (bisa dibaca tanpa membuka Actions).
      - name: Simpan status build
        if: always()
        run: |
          mkdir -p /tmp/status && cd /tmp/status
          git init -q && git checkout -q -b ci-status
          echo "${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" > status.txt
          cp "$GITHUB_WORKSPACE/ci.log" . 2>/dev/null || echo "no log" > ci.log
          cp "$GITHUB_WORKSPACE/IngetZeon.apk" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/IngetZeon-website.zip" . 2>/dev/null || true
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "status ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-status
