name: Diagnosa emulator

on:
  workflow_dispatch:
    inputs:
      new:
        description: tag versi baru
        default: latest
      old:
        description: tag versi lama (kosongkan bila tidak ada)
        default: v1.0.31

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Ambil APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.new }}" = "latest" ]; then gh release download -p IngetZeon.apk -O new.apk; else gh release download ${{ inputs.new }} -p IngetZeon.apk -O new.apk; fi
          if [ -n "${{ inputs.old }}" ]; then gh release download ${{ inputs.old }} -p IngetZeon.apk -O old.apk; fi
          ls -la *.apk
      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tool/diag.sh
      - name: Simpan hasil ke cabang diag-out
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r diag/* /tmp/out/ 2>/dev/null || true
          git config user.name ci && git config user.email ci@example.com
          git checkout --orphan diag-out && git rm -rqf . && rm -rf ./*
          cp -r /tmp/out/* . 2>/dev/null || true
          find . -name '*.xml' -size +2M -delete
          git add -A && git commit -qm "diag ${{ github.run_id }}" && git push -qf origin diag-out
