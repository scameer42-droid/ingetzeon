name: Diagnosa emulator

on:
  workflow_dispatch:
    inputs:
      new:
        description: tag versi baru
        default: latest
      old:
        description: tag versi lama (kosongkan bila tidak ada)
        default: v1.0.31

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Ambil APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.new }}" = "latest" ]; then gh release download -p IngetZeon.apk -O new.apk; else gh release download ${{ inputs.new }} -p IngetZeon.apk -O new.apk; fi
          if [ -n "${{ inputs.old }}" ]; then gh release download ${{ inputs.old }} -p IngetZeon.apk -O old.apk; fi
          ls -la *.apk
      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tool/diag.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag
          path: diag
